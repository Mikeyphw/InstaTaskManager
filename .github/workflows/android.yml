name: Insta Task Manager — source and Android APK
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

# PR branches run ONCE on pull_request; main runs on push.
# A new commit cancels stale PR CI; no redundant push+PR pipelines.
concurrency:
  group: itm-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-source:
    name: Source safety and deterministic metrics, Social P04
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source, hook, metadata, and privacy contracts
        run: python3 scripts/validate.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pure-Java procstat and social method-shape smoke
        run: |
          bash scripts/javac-smoke.sh
          bash scripts/social-shape-smoke.sh
          bash scripts/export-smoke.sh
          bash scripts/p03-smoke.sh
          bash scripts/p04-smoke.sh
          bash scripts/p04-hf01-smoke.sh
          bash scripts/p04-hf02-smoke.sh
          python3 scripts/p04-hf02-workflow-contract.py
          bash scripts/p04-hf03-smoke.sh
          bash scripts/p04-hf04-smoke.sh
          bash scripts/p04-hf05-smoke.sh
          bash scripts/p04-hf06-smoke.sh
          bash scripts/p04-hf07-smoke.sh
          bash scripts/p04-hf08-smoke.sh
          bash scripts/p04-hf09-smoke.sh
          python3 scripts/p04-hf06-startup-contract.py
          python3 scripts/p04-hf05-install-contract.py

  android:
    name: Compile API 102 module and validate APK
    runs-on: ubuntu-latest
    needs: host-source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35 via preinstalled command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" || { echo "Android SDK directory unavailable" >&2; exit 1; }
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER" || { echo "Preinstalled sdkmanager unavailable" >&2; exit 1; }
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Android compile and JUnit
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Verify APK scope and modern metadata
        run: |
          python3 scripts/validate.py --apk app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: InstaTaskManager-P04-HF09-ActualReceiver-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/SHA256SUMS
          if-no-files-found: error
